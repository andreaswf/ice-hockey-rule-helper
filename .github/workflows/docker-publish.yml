name: Build & Deploy

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hockey-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Buildx with docker-container driver (so cache/export works if you add it later)
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Login to GHCR to push
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest + full SHA (no prefix)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      # Build + push
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Azure login (expects JSON from az ad sp create-for-rbac)
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy to Azure Container Apps by digest
      - uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          environment: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          containerAppName: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
          imageToDeploy: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          targetPort: 8000
          # If image is private, provide GHCR creds for Azure to pull:
          registryServer: ghcr.io
          registryUsername: ${{ github.repository_owner }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}
