<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Hockey Rule Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 1rem;
    }
    input, button, textarea {
      font-size: 1rem;
    }
    textarea {
      width: 100%;
      height: 300px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>🏒 Ice Hockey Rule Assistant</h1>
  <p>Ask a question about the IIHF rulebook:</p>

  <input id="question" type="text" placeholder="e.g. What is icing?" size="50" />
  <button id="ask">Ask</button>

  <h2>Answer:</h2>
  <textarea id="answer" readonly></textarea>

  <script>
    const askBtn = document.getElementById("ask");
    const questionInput = document.getElementById("question");
    const answerBox = document.getElementById("answer");

    askBtn.addEventListener("click", async () => {
      const question = questionInput.value.trim();
      if (!question) return alert("Please enter a question");

      answerBox.value = "Thinking...";

      try {
        const res = await fetch("/predict?include_docs=false", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();
        answerBox.value = data.answer || "No answer received.";
      } catch (err) {
        answerBox.value = "Error: " + err.message;
      }
    });

    questionInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      askBtn.click();
    }
    });
  </script>
</body>
</html>
